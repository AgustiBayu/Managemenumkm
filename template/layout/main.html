{{define "main"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Managemen UMKM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">    
        <style>
            /* Indent the submenu to show hierarchy */
            .dropdown-submenu .dropdown-menu {
                margin-left: 0.5rem;
                border: none; /* Optional: remove border for a flatter look */
            }
    
            /* Style for the submenu toggle arrow */
            .dropdown-submenu > .dropdown-toggle::after {
                transform: rotate(-90deg); /* Start pointing right */
                transition: transform 0.2s ease-in-out;
            }
    
            /* Rotate arrow when submenu is open */
            .dropdown-submenu > .dropdown-toggle.submenu-open::after {
                transform: rotate(0deg); /* Point down when open */
            }
        </style>
    </head><body class="d-flex flex-column min-vh-100">

    {{template "navbar" .}}

    <main class="container-fluid flex-grow-1 mt-3 mb-5">
        {{ block "content" . }}{{ end }}
    </main>

    {{template "footer" .}}
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>    
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.dropdown-menu .dropdown-submenu').forEach(function (element) {
                element.addEventListener('click', function (e) {
                    e.stopPropagation(); // Prevent the main dropdown from closing

                    let toggle = this.querySelector('.dropdown-toggle');
                    let submenu = this.querySelector('.dropdown-menu');

                    if (submenu && toggle) {
                        submenu.classList.toggle('show');
                        toggle.classList.toggle('submenu-open'); // Toggle class for CSS styling
                    }

                    // Close other open submenus to avoid clutter
                    let parentMenu = this.closest('.dropdown-menu');
                    if (parentMenu) {
                        parentMenu.querySelectorAll('.dropdown-submenu').forEach(function (otherElement) {
                            if (otherElement !== element) {
                                let otherSubmenu = otherElement.querySelector('.dropdown-menu');
                                let otherToggle = otherElement.querySelector('.dropdown-toggle');
                                if (otherSubmenu && otherToggle) {
                                    otherSubmenu.classList.remove('show');
                                    otherToggle.classList.remove('submenu-open');
                                }
                            }
                        });
                    }
                });
            });
        });
    </script>
    <script>
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const formattedTime = `${hours}:${minutes}:${seconds}`;
            document.getElementById('realtimeClock').textContent = formattedTime;
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
{{end}}
