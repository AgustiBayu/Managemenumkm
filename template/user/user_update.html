{{ define "title" }}Edit User{{ end }}

{{ define "content" }}
<style>
    .preview-thumbnail {
        max-width: 200px;
        max-height: 200px;
        margin-top: 15px;
        border-radius: 8px;
        border: 1px solid #ddd;
        padding: 5px;
    }
</style>

<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header">
            <h2 class="mb-0">Edit User</h2>
        </div>
        <div class="card-body">
            <form action="/user/edit/{{.User.ID}}" method="POST" enctype="multipart/form-data">
                <div class="row">
                    <div class="col-md-8">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="first_name" class="form-label">First Name</label>
                                <input type="text" class="form-control" id="first_name" name="first_name" required value="{{.User.FName}}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="last_name" class="form-label">Last Name</label>
                                <input type="text" class="form-control" id="last_name" name="last_name" required value="{{.User.LName}}">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" required value="{{.User.Email}}">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">New Password (optional)</label>
                            <input type="password" class="form-control" id="password" name="password">
                        </div>
                        <div class="mb-3">
                            <label for="alamat" class="form-label">Alamat</label>
                            <input type="text" class="form-control" id="alamat" name="alamat" required value="{{.User.Alamat}}">
                        </div>
                        <div class="mb-3">
                            <label for="number" class="form-label">Number</label>
                            <input type="text" class="form-control" id="number" name="number" required value="{{.User.Number}}">
                        </div>
                        <div class="mb-3">
                            <label for="toko_id" class="form-label">Toko</label>
                            <select class="form-select" id="toko_id" name="toko_id" required>
                                <option value="">Select Toko</option>
                                {{range .Tokos}}
                                <option value="{{.ID}}" {{if $.User.Toko}}{{if eq .ID $.User.Toko.ID}}selected{{end}}{{end}}>{{.Name}}</option>
                                {{end}}
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="role" class="form-label">Role</label>
                                <select class="form-select" id="role" name="role" required>
                                    <option value="admin"   {{if eq .User.Role "admin"}}selected{{end}}>Admin</option>
                                    <option value="cashier" {{if eq .User.Role "cashier"}}selected{{end}}>Cashier</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="subscription_status" class="form-label">Subscription Status</label>
                                <select class="form-select" id="subscription_status" name="subscription_status" required>
                                    <option value="active"   {{if eq .User.SubscriptionStatus "active"}}selected{{end}}>Active</option>
                                    <option value="inactiv" {{if eq .User.SubscriptionStatus "inactiv"}}selected{{end}}>Inactiv</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="subscription_status" class="form-label">Subscription Status</label>
                                <input type="text" class="form-control" id="subscription_status" name="subscription_status" value="{{.User.SubscriptionStatus}}">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="subscription_expiry" class="form-label">Subscription Expiry</label>
                            <input type="date" class="form-control" id="subscription_expiry" name="subscription_expiry" value="{{.User.SubscriptionExpiry}}">
                        </div>
                    </div>
                    <div class="col-md-4 text-center">
                        <label class="form-label">Thumbnail</label>
                        {{if .User.Thumbnail}}
                            <img src="/{{.User.Thumbnail}}" alt="Current Thumbnail" class="img-fluid rounded preview-thumbnail">
                        {{else}}
                            <div class="text-muted">No thumbnail</div>
                        {{end}}
                        <div class="mt-3">
                            <label for="thumbnail" class="form-label">Upload New Thumbnail</label>
                            <input type="file" class="form-control" id="thumbnail" name="thumbnail">
                        </div>
                    </div>
                </div>

                <hr class="my-4">

                <div class="d-flex justify-content-end">
                    <a href="/user" class="btn btn-secondary me-2">Cancel</a>
                    <button type="submit" class="btn btn-primary">Update User</button>
                </div>
            </form>
        </div>
    </div>
</div>
{{ end }}
