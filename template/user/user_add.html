{{ define "title" }}Add User{{ end }}

{{ define "content" }}
<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header">
            <h2 class="mb-0">Add User</h2>
        </div>
        <div class="card-body">
            <form action="/user/add" method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="first_name" class="form-label">First Name</label>
                        <input type="text" class="form-control" id="first_name" name="first_name" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="last_name" class="form-label">Last Name</label>
                        <input type="text" class="form-control" id="last_name" name="last_name" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <div class="mb-3">
                    <label for="alamat" class="form-label">Alamat</label>
                    <input type="text" class="form-control" id="alamat" name="alamat" required>
                </div>
                <div class="mb-3">
                    <label for="number" class="form-label">Number</label>
                    <input type="text" class="form-control" id="number" name="number" required>
                </div>
                <div class="mb-3">
                    <label for="toko_id" class="form-label">Toko</label>
                    <select class="form-select" id="toko_id" name="toko_id" required>
                        <option value="">Select Toko</option>
                        {{range .Tokos}}
                        <option value="{{.ID}}">{{.Name}}</option>
                        {{end}}
                    </select>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="role" class="form-label">Role</label>
                        <select class="form-select" id="role" name="role" required>
                            <option value="admin">Admin</option>
                            <option value="cashier">Cashier</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="subscription_status" class="form-label">Subscription Status</label>
                        <select class="form-select" id="subscription_status" name="subscription_status" required>
                            <option value="active">Active</option>
                            <option value="inactiv">Inactive</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="subscription_expiry" class="form-label">Subscription Expiry</label>
                    <input type="date" class="form-control" id="subscription_expiry" name="subscription_expiry">
                </div>

                <hr class="my-4">

                <div class="d-flex justify-content-end">
                    <a href="/user" class="btn btn-secondary me-2">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save User</button>
                </div>
            </form>
        </div>
    </div>
</div>
{{ end }}
