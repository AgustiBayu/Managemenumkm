{{ define "title" }}Update User{{ end }}

{{ define "content" }}
<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header">
            <h2 class="mb-0">Update Toko</h2>
        </div>
        <div class="card-body">
            <form action="/category/edit/{{.Category.ID}}" method="POST">
                <div class="form-group">
                    <label for="category">Name</label>
                    <input type="text" class="form-control" id="category" name="category" value="{{.Category.Category}}" required>
                </div>                
                <div class="d-flex justify-content-end mt-3">
                    <a href="/toko" class="btn btn-secondary me-2">Cancel</a>
                    <button type="submit" class="btn btn-primary">Update</button>
                </div>
            </form>
        </div>
    </div>
</div>
{{ end }}
