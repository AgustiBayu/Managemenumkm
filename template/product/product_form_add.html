{{ define "title" }}Add Master Product{{ end }}

{{ define "content" }}
<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header">
            <h2 class="mb-0">Add New Master Product</h2>
        </div>
        <div class="card-body">
            <form action="/product/add" method="POST">
                <div class="row">
                    <div class="col-md-12 mb-3">
                        <label for="name" class="form-label">Product Name</label>
                        <input type="text" class="form-control" id="name" name="name" required autofocus>
                        <div class="form-text">The general name of the product, e.g., "Susu UHT Coklat 1L".</div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="sku" class="form-label">SKU (Stock Keeping Unit)</label>
                        <input type="text" class="form-control" id="sku" name="sku" required>
                        <div class="form-text">A unique code for this product, e.g., "SS-CKL-1L".</div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="category_id" class="form-label">Category</label>
                        <select class="form-select" id="category_id" name="category_id" required>
                            <option value="" disabled selected>Choose category...</option>
                            {{range .Categories}}
                                <option value="{{.ID}}">{{.Category}}</option>
                            {{end}}
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="price" class="form-label">Price</label>
                        <input type="number" class="form-control" id="price" name="price" required min="0">
                        <div class="form-text">The selling price for a single item of this product.</div>
                    </div>
                </div>

                <hr class="my-4">

                <div class="d-flex justify-content-end">
                    <a href="/product" class="btn btn-secondary me-2">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Master Product</button>
                </div>
            </form>
        </div>
    </div>
</div>
{{ end }}
