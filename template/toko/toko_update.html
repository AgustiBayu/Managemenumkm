{{define "content"}}
<div class="container-fluid">
    <h1 class="h3 mb-2 text-gray-800">Update Toko</h1>
    <div class="card shadow mb-4">
        <div class="card-body">
            <form action="/toko/edit/{{.Toko.ID}}" method="POST">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{.Toko.Name}}" required>
                </div>
                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" class="form-control" id="address" name="address" value="{{.Toko.Address}}" required>
                </div>
                <button type="submit" class="btn btn-primary">Update</button>
            </form>
        </div>
    </div>
</div>
{{end}}
